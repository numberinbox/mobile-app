on:
  # Manual trigger: verify the gate on demand, without needing a push.
  workflow_dispatch:
  pull_request:
    paths-ignore: &docs_only
      - ".github/**"
      - "docs/**"
      - "Jenkinsfile"
      - "**/*.md"
  push:
    branches:
      - master
    paths-ignore: *docs_only

# One analyze+test run per ref at a time: a newer push supersedes the run for
# the previous commit instead of queueing behind it.
concurrency:
  group: analyze-test-${{ github.ref }}
  cancel-in-progress: true

name: Analyze and test

env:
  FLUTTER_VERSION: 3.38.9
  # The runner occasionally aborts the ~1.4 GB SDK download mid-stream
  # (curl 92, HTTP/2 INTERNAL_ERROR), which used to kill whole matrix jobs
  # before a single test ran. Three attempts turn that into a slow pass.
  FLUTTER_INSTALL_ATTEMPTS: "3"

jobs:
  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Discover packages with tests
        id: modules
        run: |
          modules=$(git ls-files 'test/*_test.dart' '*/test/*_test.dart' \
            | awk -F/ '$1 == "test" || $1 == "tmail-mcp" { print "default"; next } { print $1 }' \
            | sort -u | jq -R . | jq -sc .)
          if [[ "$modules" == "[]" ]]; then
            echo "ERROR: no test found" >&2
            exit 1
          fi
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  analyze-test:
    needs: discover-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        modules: ${{ fromJSON(needs.discover-tests.outputs.modules) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup flutter
        id: flutter_setup
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true
          cache-key: "deps-${{ hashFiles('pubspec.lock') }}"
          cache-path: ${{ runner.tool_cache }}/flutter # optional, change this to specify the cache path
        # Allowed to fail without failing the job: the step below installs the
        # same SDK itself when this one is unlucky with the network.
        continue-on-error: true

      # subosito/flutter-action downloads the SDK with a single curl and no
      # retry, so one dropped HTTP/2 stream failed whole matrix jobs before a
      # test could run. If it fails, install the same SDK ourselves into the
      # same tool-cache path, so the next run still hits the cache.
      - name: Install the Flutter SDK directly if the action failed
        if: steps.flutter_setup.outcome == 'failure'
        run: |
          set -euo pipefail
          url="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          target="${RUNNER_TOOL_CACHE}/flutter"
          for attempt in $(seq 1 "$FLUTTER_INSTALL_ATTEMPTS"); do
            echo "direct flutter install: attempt $attempt of $FLUTTER_INSTALL_ATTEMPTS"
            rm -rf "$target" "$target.lock"
            if curl -fsSL --retry 3 --retry-delay 10 --retry-all-errors \
                 -o /tmp/flutter_sdk.tar.xz "$url"; then
              mkdir -p "$RUNNER_TOOL_CACHE"
              tar -xf /tmp/flutter_sdk.tar.xz -C "$RUNNER_TOOL_CACHE"
              rm -f /tmp/flutter_sdk.tar.xz
              echo "$target/bin" >> "$GITHUB_PATH"
              "$target/bin/flutter" --version
              exit 0
            fi
            sleep $(( attempt * 15 ))
          done
          echo "could not install the Flutter SDK after $FLUTTER_INSTALL_ATTEMPTS attempts" >&2
          exit 1

      - name: Setup Firebase env
        env:
          FIREBASE_ENV: ${{ secrets.FIREBASE_ENV }}
        run: ./scripts/setup-firebase.sh

      - name: Run prebuild
        id: prebuild
        run: ./scripts/prebuild.sh

      - name: Analyze
        uses: zgosalvez/github-actions-analyze-dart@v1

      - name: Test
        if: ${{ !cancelled() && steps.prebuild.outcome == 'success' }}
        env:
          MODULES: ${{ matrix.modules }}
        run: ./scripts/test.sh

      - name: Upload test reports
        if: success() || failure() # Always upload report
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.modules }}
          path: test-report*.json

  javascript-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test JavaScript
        run: node --test
